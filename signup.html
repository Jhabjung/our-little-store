<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in - Our Little Store</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">
  <div class="welcome-side">
    <div class="welcome-title">Welcome to<br>Our Little Store</div>
  </div>

  <div class="card-side">
    <div class="card">
      <h2>Sign up</h2>
      <input type="email" id="suEmail" placeholder="Email" autocomplete="email">
      <input type="password" id="suPassword" placeholder="Password" autocomplete="new-password">
      <div class="error-msg" id="suError"></div>
      <button class="btn-primary" id="suBtn">Sign up</button>
      <div class="divider">or</div>
      <button class="btn-google" id="suGoogleBtn">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.6 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.5-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.6 15.1 18.9 12 24 12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.5 6.1 29.5 4 24 4c-7.7 0-14.4 4.3-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.3 0 10.1-2 13.7-5.4l-6.3-5.3C29.4 35 26.8 36 24 36c-5.4 0-9.9-3.4-11.5-8.2l-6.6 5.1C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.1-3.3 5.6-6.2 7.3l6.3 5.3C38.6 38 44 32.5 44 24c0-1.3-.1-2.5-.4-3.5z"/></svg>
        Sign up with Google
      </button>
      <div class="switch-text">Already have account? <a href="index.html">Log in</a></div>
    </div>
  </div>
</div>

<!-- Popup ตั้งค่าโปรไฟล์ครั้งแรก -->
<div class="modal-overlay hidden" id="profileModal">
  <div class="modal-card">
    <div class="avatar-wrap">
      <img id="avatarPreview" src="https://placehold.co/90/9b8fb8/ffffff?text=+" alt="profile">
      <button class="avatar-edit-btn" id="avatarEditBtn">✎</button>
      <input type="file" id="avatarInput" accept="image/*" style="display:none">
    </div>
    <input type="text" id="usernameInput" placeholder="Username" style="width:100%;">
    <div class="error-msg" id="profileError"></div>
    <button class="btn-primary" id="profileSubmitBtn" style="width:100%;">Submit</button>
  </div>
</div>

<script type="module" src="signup.js"></script>
</body>
</html>
